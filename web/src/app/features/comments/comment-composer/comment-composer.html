<form
  class="composer"
  (ngSubmit)="submit()"
  novalidate>

  <div class="composer-title">
    @if (parentId()) {
      Ответить на комментарий
    } @else {
      Написать комментарий
    }
  </div>

  <div class="fields">
    <label>
      <span>Имя *</span>

      <input
        type="text"
        name="userName"
        [(ngModel)]="userName"
        placeholder="Ваше имя"
        autocomplete="name" />
    </label>

    <label>
      <span>E-mail *</span>

      <input
        type="email"
        name="email"
        [(ngModel)]="email"
        placeholder="example@mail.com"
        autocomplete="email" />
    </label>

    <label>
      <span>Домашняя страница</span>

      <input
        type="url"
        name="homePage"
        [(ngModel)]="homePage"
        placeholder="https://example.com"
        autocomplete="url" />
    </label>
  </div>

  <label class="text-field">
    <span>Комментарий *</span>

    <textarea
      name="text"
      [(ngModel)]="text"
      rows="6"
      placeholder="Введите текст комментария...">
    </textarea>
  </label>

  <div class="attachment">
    <label class="file-label">
      <span>Файл</span>

      <input
        type="file"
        accept="image/*,.txt"
        (change)="onFileSelected($event)" />
    </label>

    @if (file) {
      <span class="file-name">
        {{ file.name }}
      </span>
    }
  </div>

  <div class="captcha-section">
    <div class="captcha-image">
      @if (captchaImage()) {
        <img
          [src]="captchaImage()!"
          alt="CAPTCHA" />
      } @else {
        <span>Загрузка...</span>
      }
    </div>

    <button
      type="button"
      class="captcha-refresh"
      (click)="loadCaptcha()"
      [disabled]="loadingCaptcha()"
      title="Обновить CAPTCHA">
      ↻
    </button>

    <input
      type="text"
      name="captchaAnswer"
      [(ngModel)]="captchaAnswer"
      placeholder="Введите код"
      autocomplete="off" />
  </div>

  @if (error()) {
    <div class="form-error">
      {{ error() }}
    </div>
  }

  <div class="composer-actions">
    @if (parentId()) {
      <button
        type="button"
        class="cancel-button"
        (click)="cancel()">
        Отмена
      </button>
    }

    <button
      type="submit"
      class="submit-button"
      [disabled]="submitting()">

      @if (submitting()) {
        Отправка...
      } @else {
        {{ parentId() ? 'Ответить' : 'Отправить' }}
      }
    </button>
  </div>
</form>
