# Если клиент просит апгрейд до WebSocket, пробрасываем его, иначе обычное соединение
map $http_upgrade $connection_upgrade {
    default upgrade;
    ''      close;
}

server {
    listen 80;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    # Файлы до 6 МБ
    client_max_body_size 6m;

    # Запросы к API пересылаем на контейнер api
    location /api/ {
        proxy_pass http://api:8080;

        proxy_http_version 1.1;

        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # GraphQL: запросы и встроенный интерфейс
    location /graphql {
        proxy_pass http://api:8080;

        proxy_http_version 1.1;

        # $http_host сохраняет порт (на $host он теряется)
        proxy_set_header Host $http_host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # SignalR (WebSocket): хаб комментариев
    location /hubs/ {
        proxy_pass http://api:8080;

        proxy_http_version 1.1;

        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection $connection_upgrade;

        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        # соединение долгоживущее: не рвём его по таймауту простоя и не буферизуем поток
        proxy_read_timeout 1h;
        proxy_send_timeout 1h;
        proxy_buffering off;
    }

    # Angular SPA
    location / {
        try_files $uri $uri/ /index.html;
    }
}