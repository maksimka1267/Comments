services:
  mssql:
    image: mcr.microsoft.com/mssql/server:2022-latest
    environment:
      ACCEPT_EULA: "Y"
      MSSQL_SA_PASSWORD: "${MSSQL_SA_PASSWORD:-Comments_Dev123!}"
    ports:
      - "1433:1433"   # нужен для разработки с локальным API, на сервере можно убрать
    volumes:
      - mssqldata:/var/opt/mssql
    healthcheck:
      test: /opt/mssql-tools18/bin/sqlcmd -S localhost -U sa -P "$$MSSQL_SA_PASSWORD" -C -Q "SELECT 1" || exit 1
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 20s

  redis:
    image: redis:7-alpine
    # volatile-lru вытесняет только ключи с TTL (капчи, кэш); счётчики версий кэша без TTL не трогает
    command: ["redis-server", "--maxmemory", "128mb", "--maxmemory-policy", "volatile-lru", "--save", "", "--appendonly", "no"]
    ports:
      - "6379:6379"   # для разработки, на сервере можно убрать
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10

  rabbitmq:
    image: rabbitmq:4-management
    environment:
      RABBITMQ_DEFAULT_USER: comments
      RABBITMQ_DEFAULT_PASS: "${RABBITMQ_PASSWORD:-comments_dev}"
    ports:
      - "5672:5672"     # для разработки с локальным API
      - "15672:15672"   # веб-интерфейс управления
    healthcheck:
      test: ["CMD", "rabbitmq-diagnostics", "-q", "ping"]
      interval: 10s
      timeout: 10s
      retries: 10
      start_period: 30s

  elasticsearch:
    image: docker.elastic.co/elasticsearch/elasticsearch:9.3.0
    environment:
      discovery.type: single-node
      # только для разработки и демо: без аутентификации и TLS, наружу порт на сервере не открывать
      xpack.security.enabled: "false"
      # ограничиваем память JVM, иначе Elasticsearch займёт половину оперативной памяти
      ES_JAVA_OPTS: "-Xms512m -Xmx512m"
    ports:
      - "9200:9200"   # для разработки с локальным API, на сервере можно убрать
    volumes:
      - esdata:/usr/share/elasticsearch/data
    healthcheck:
      test: ["CMD-SHELL", "curl -fs 'http://localhost:9200/_cluster/health?wait_for_status=yellow&timeout=5s' || exit 1"]
      interval: 10s
      timeout: 10s
      retries: 12
      start_period: 30s

  api:
    build:
      context: .
      dockerfile: src/Comments.Api/Dockerfile
    environment:
      ASPNETCORE_ENVIRONMENT: Production
      MigrateOnStartup: "true"
      ConnectionStrings__Default: "Server=mssql;Database=Comments;User Id=sa;Password=${MSSQL_SA_PASSWORD:-Comments_Dev123!};TrustServerCertificate=True"
      ConnectionStrings__RabbitMq: "amqp://comments:${RABBITMQ_PASSWORD:-comments_dev}@rabbitmq:5672/"
      ConnectionStrings__Redis: "redis:6379"
      ConnectionStrings__Elasticsearch: "http://elasticsearch:9200"
      FileStorage__RootPath: /app/uploads
    volumes:
      - uploads:/app/uploads
    depends_on:
      mssql:
        condition: service_healthy
      redis:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy
      elasticsearch:
        condition: service_healthy

  web:
    build: ./web
    ports:
      - "${WEB_PORT:-8080}:80"
    depends_on:
      - api

volumes:
  mssqldata:
  uploads:
  esdata: